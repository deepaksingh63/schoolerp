<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SD Public School</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="emoji">🎓</div>
      <h1>SD Public School</h1>
      <p>Smart School Management Portal</p>
    </div>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Log In</button>
    </form>

    <p class="switch-line">New teacher, student, or parent? <a href="signup.html">Create an account</a></p>

    <div class="reg-note" style="margin-top:18px">
      <strong>Demo credentials</strong><br>
      Admin: admin / Admin@123 &nbsp;·&nbsp; Teacher: teacher / Teacher@123<br>
      Student: student / Student@123 &nbsp;·&nbsp; Parent: parent / Parent@123
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) location.href = "app.html";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById("alertBox");
    alertBox.innerHTML = "";
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn = e.target.querySelector("button");
    btn.disabled = true; btn.textContent = "Logging in...";
    try {
      const data = await api("/auth/login", { method: "POST", body: { username, password } });
      Auth.setToken(data.token);
      location.href = "app.html";
    } catch (err) {
      alertBox.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
      btn.disabled = false; btn.textContent = "Log In";
    }
  });
</script>
</body>
</html>
